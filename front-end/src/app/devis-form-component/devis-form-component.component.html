<div class="devis-form-page">
  <header class="form-header">
    <div class="header-content">
      <h1><a routerLink="/dashboard" class="brand-link">AutoGest</a></h1>
      <div class="header-actions">
        <button (click)="logout()" class="icon-btn" aria-label="Se déconnecter">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v10"/>
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Menu" (click)="openMenu()">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()" class="devis-form">
    <h1>Nouveau devis</h1>

    <div class="form-group">
      <label for="client">Client</label>
      <select id="client" name="client_id" [(ngModel)]="clientId" required>
        <option [ngValue]="undefined" disabled>Sélectionner un client</option>
        @for (client of clients; track client.id) {
          <option [ngValue]="client.id">{{ client.prenom }} {{ client.nom }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" [(ngModel)]="date" required>
    </div>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <button type="submit">Créer le devis</button>
    <a routerLink="/dashboard" class="back-link">← Retour au tableau de bord</a>
    </form>
  </div>
</div>
