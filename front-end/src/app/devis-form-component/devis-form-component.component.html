<div class="form-container">
  <form (ngSubmit)="onSubmit()" class="devis-form">
    <h1>Nouveau devis</h1>

    <div class="form-group">
      <label for="client">Client</label>
      <select id="client" name="client_id" [(ngModel)]="clientId" required>
        <option [ngValue]="undefined" disabled>Sélectionner un client</option>
        @for (client of clients; track client.id) {
          <option [ngValue]="client.id">{{ client.prenom }} {{ client.nom }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="date">Date</label>
      <input type="date" id="date" name="date" [(ngModel)]="date" required>
    </div>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <button type="submit">Créer le devis</button>
    <a routerLink="/dashboard" class="back-link">← Retour au tableau de bord</a>
  </form>
</div>
