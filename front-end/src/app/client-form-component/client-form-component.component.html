<div class="client-form-page">
  <header class="form-header">
    <div class="header-content">
      <h1><a routerLink="/dashboard" class="brand-link">AutoGest</a></h1>
      <div class="header-actions">
        <button (click)="logout()" class="icon-btn" aria-label="Se déconnecter">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v10"/>
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Menu" (click)="openMenu()">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="form-body">
    <a routerLink="/clients" class="breadcrumb">Clients</a>
    <h2>{{ isEditMode ? 'Modifier le client' : 'Nouveau client' }}</h2>

    <form (ngSubmit)="onSubmit()" class="client-form">
      <section class="form-section">
        <h3>Informations client</h3>
        <div class="form-group">
          <label for="nom" class="sr-only">Nom</label>
          <input type="text" id="nom" name="nom" [(ngModel)]="client.nom" required placeholder="Nom">
        </div>
        <div class="form-group">
          <label for="prenom" class="sr-only">Prénom</label>
          <input type="text" id="prenom" name="prenom" [(ngModel)]="client.prenom" required placeholder="Prenom">
        </div>
        <div class="form-group">
          <label for="telephone" class="sr-only">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" [(ngModel)]="client.telephone" required placeholder="Téléphone">
        </div>
        <div class="form-group">
          <label for="email" class="sr-only">Email</label>
          <input type="email" id="email" name="email" [(ngModel)]="client.email" placeholder="Email">
        </div>
        <div class="form-group">
          <label for="adresse" class="sr-only">Adresse</label>
          <input type="text" id="adresse" name="adresse" [(ngModel)]="client.adresse" placeholder="Adresse">
        </div>
      </section>

      @if (!isEditMode) {
        <section class="form-section">
          <h3>Véhicule</h3>
          <div class="form-group">
            <label for="marque" class="sr-only">Marque</label>
            <input type="text" id="marque" name="marque" [(ngModel)]="vehicule.marque" required placeholder="Marque">
          </div>
          <div class="form-group">
            <label for="modele" class="sr-only">Modèle</label>
            <input type="text" id="modele" name="modele" [(ngModel)]="vehicule.modele" required placeholder="Modéle">
          </div>
          <div class="form-group">
            <label for="immatriculation" class="sr-only">Immatriculation</label>
            <input type="text" id="immatriculation" name="immatriculation" [(ngModel)]="vehicule.immatriculation" required placeholder="Immatriculation">
          </div>
        </section>
      }

      @if (errorMessage) {
        <p class="error-message">{{ errorMessage }}</p>
      }

      @if (successMessage) {
        <p class="success-message">{{ successMessage }}</p>
      }

      <button type="submit">{{ isEditMode ? 'Enregistrer' : 'Enregistrer le client' }}</button>
      <a routerLink="/dashboard" class="back-link">← Retour au tableau de bord</a>
    </form>
  </div>
</div>
