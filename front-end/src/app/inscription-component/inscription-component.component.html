<div class="register-page">
  <header class="register-header">
    <svg class="mechanic-motif" viewBox="0 0 200 160" aria-hidden="true">
      <circle cx="185" cy="15" r="10" />
      <circle cx="185" cy="15" r="35" />
      <circle cx="185" cy="15" r="60" />
      <line x1="185" y1="-45" x2="185" y2="75" />
      <line x1="125" y1="15" x2="245" y2="15" />
      <line x1="143" y1="-27" x2="227" y2="57" />
      <line x1="227" y1="-27" x2="143" y2="57" />
    </svg>
    <h1>AutoGest</h1>
    <p>Créer votre compte garage</p>
  </header>

  <form (ngSubmit)="onSubmit()" class="register-form">
    <section class="form-section">
      <h2>Votre garage</h2>
      <div class="form-group">
        <label for="nomGarage" class="sr-only">Nom du garage</label>
        <input type="text" id="nomGarage" name="nomGarage" [(ngModel)]="nomGarage" required placeholder="Nom du garage">
      </div>
      <div class="form-group">
        <label for="adresseGarage" class="sr-only">Adresse du garage</label>
        <input type="text" id="adresseGarage" name="adresseGarage" [(ngModel)]="adresseGarage" required placeholder="Adresse du garage">
      </div>
    </section>

    <section class="form-section">
      <h2>Vos informations</h2>
      <div class="form-group">
        <label for="nom" class="sr-only">Nom prénom</label>
        <input type="text" id="nom" name="nom" [(ngModel)]="nom" required placeholder="Nom prenom">
      </div>
      <div class="form-group">
        <label for="email" class="sr-only">Email</label>
        <input type="email" id="email" name="email" [(ngModel)]="email" required placeholder="Email">
      </div>
      <div class="form-group">
        <label for="motDePasse" class="sr-only">Mot de passe</label>
        <input type="password" id="motDePasse" name="motDePasse" [(ngModel)]="motDePasse" required placeholder="Mot de passe">
      </div>
      <div class="form-group">
        <label for="confirmationMotDePasse" class="sr-only">Confirmer le mot de passe</label>
        <input type="password" id="confirmationMotDePasse" name="confirmationMotDePasse" [(ngModel)]="confirmationMotDePasse" required placeholder="Confirmer le mot de passe">
      </div>
    </section>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    <button type="submit">Créer mon compte</button>

    <p class="login-link">Déjà un compte ? <a routerLink="/login">Se connecter</a></p>
  </form>
</div>
