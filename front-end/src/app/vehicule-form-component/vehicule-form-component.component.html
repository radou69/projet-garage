<div class="vehicule-form-page">
  <header class="form-header">
    <div class="header-content">
      <h1><a routerLink="/dashboard" class="brand-link">AutoGest</a></h1>
      <div class="header-actions">
        <button (click)="logout()" class="icon-btn" aria-label="Se déconnecter">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M12 2v10"/>
            <path d="M18.36 6.64a9 9 0 1 1-12.73 0"/>
          </svg>
        </button>
        <button class="icon-btn" aria-label="Menu" (click)="openMenu()">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16"/>
            <path d="M4 12h16"/>
            <path d="M4 18h16"/>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <div class="form-container">
    <form (ngSubmit)="onSubmit()" class="vehicule-form">
    <h1>{{ isEditMode ? 'Modifier le véhicule' : 'Nouveau véhicule' }}</h1>

    <div class="form-group">
      <label for="client">Client</label>
      <select id="client" name="client_id" [(ngModel)]="vehicule.client_id" required>
        <option [ngValue]="undefined" disabled>Sélectionner un client</option>
        @for (client of clients; track client.id) {
          <option [ngValue]="client.id">{{ client.prenom }} {{ client.nom }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="marque">Marque</label>
      <input type="text" id="marque" name="marque" [(ngModel)]="vehicule.marque" required>
    </div>

    <div class="form-group">
      <label for="modele">Modèle</label>
      <input type="text" id="modele" name="modele" [(ngModel)]="vehicule.modele" required>
    </div>

    <div class="form-group">
      <label for="immatriculation">Immatriculation</label>
      <input type="text" id="immatriculation" name="immatriculation" [(ngModel)]="vehicule.immatriculation" required>
    </div>

    <div class="form-group">
      <label for="carburant">Carburant</label>
      <input type="text" id="carburant" name="carburant" [(ngModel)]="vehicule.carburant">
    </div>

    <div class="form-group">
      <label for="vin">VIN</label>
      <input type="text" id="vin" name="vin" [(ngModel)]="vehicule.vin">
    </div>

    <div class="form-group">
      <label for="annee">Année</label>
      <input type="number" id="annee" name="annee" [(ngModel)]="vehicule.annee">
    </div>

    <div class="form-group">
      <label for="kilometrage">Kilométrage</label>
      <input type="number" id="kilometrage" name="kilometrage" [(ngModel)]="vehicule.kilometrage">
    </div>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    @if (successMessage) {
      <p class="success-message">{{ successMessage }}</p>
    }

    <button type="submit">{{ isEditMode ? 'Enregistrer' : 'Créer le véhicule' }}</button>
    <a routerLink="/dashboard" class="back-link">← Retour au tableau de bord</a>
    </form>
  </div>
</div>
