<div class="form-container">
  <form (ngSubmit)="onSubmit()" class="rdv-form">
    <h1>{{ isEditMode ? 'Modifier le rendez-vous' : 'Nouveau rendez-vous' }}</h1>

    <div class="form-group">
      <label for="client">Client</label>
      <select id="client" name="client_id" [(ngModel)]="clientId" required>
        <option [ngValue]="undefined" disabled>Sélectionner un client</option>
        @for (client of clients; track client.id) {
          <option [ngValue]="client.id">{{ client.prenom }} {{ client.nom }}</option>
        }
      </select>
    </div>

    <div class="form-group">
      <label for="dateHeure">Date et heure</label>
      <input type="datetime-local" id="dateHeure" name="dateHeure" [(ngModel)]="dateHeureLocal" required>
    </div>

    <div class="form-group">
      <label for="description">Description</label>
      <input type="text" id="description" name="description" [(ngModel)]="description">
    </div>

    @if (errorMessage) {
      <p class="error-message">{{ errorMessage }}</p>
    }

    @if (successMessage) {
      <p class="success-message">{{ successMessage }}</p>
    }

    <button type="submit">{{ isEditMode ? 'Enregistrer' : 'Créer le rendez-vous' }}</button>
    <a routerLink="/dashboard" class="back-link">← Retour au tableau de bord</a>
  </form>
</div>
